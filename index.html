<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 MessagingApp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            position: relative;
        }

        .app::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        .app::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, -20px); }
        }

        /* Auth Screen */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header h1 {
            text-align: center;
            font-size: 36px;
            margin: 0 0 12px 0;
            color: white;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .auth-header p {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin: 0 0 35px 0;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary {
            width: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* Chat Interface */
        .chat-container {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-list {
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        .chat-list-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-list-header h2 {
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .chat-list-header .username {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 4px;
        }

        .chat-items {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 12px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .chat-item.active {
            background: rgba(255, 255, 255, 0.25);
            border-left: 3px solid white;
        }

        .chat-item-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
        }

        .chat-item-name {
            color: white;
            font-weight: 600;
            font-size: 15px;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-header h3 {
            color: white;
            font-size: 19px;
            font-weight: 700;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: messageSlideIn 0.4s ease;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 70%;
        }

        .message-sender {
            font-size: 13px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .message-bubble p {
            margin: 0;
            color: #333;
            line-height: 1.5;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 6px;
            display: block;
        }

        .message.own {
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        .message.own .message-content {
            align-items: flex-end;
            display: flex;
            flex-direction: column;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .message.own .message-bubble p {
            color: white;
        }

        .message.own .message-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .message-input-container {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            font-size: 15px;
            color: white;
            transition: all 0.3s;
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .message-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .send-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.4);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .chat-list {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .chat-list.open {
                transform: translateX(0);
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Auth Screen -->
        <div id="authContainer" class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>💬 MessagingApp</h1>
                    <p>Welcome! Enter your name to start</p>
                </div>
                <form id="authForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required autofocus>
                    </div>
                    <button type="submit" class="btn-primary">Start Messaging</button>
                </form>
            </div>
        </div>

        <!-- Chat Interface -->
        <div id="chatContainer" class="chat-container">
            <div class="chat-list">
                <div class="chat-list-header">
                    <h2>💬 MessagingApp</h2>
                    <div class="username" id="currentUsername"></div>
                </div>
                <div class="chat-items" id="chatList"></div>
            </div>

            <div class="chat-window">
                <div class="chat-header">
                    <h3 id="activeChatName">Select a chat</h3>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
                <form class="message-input-container" id="messageForm">
                    <input type="text" class="message-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-button">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2 10L18 3L11 19L9 12L2 10Z" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Simple in-memory chat app (no backend)
        let currentUser = '';
        let activeChat = 'General';
        let chats = {
            'General': { name: 'General', messages: [] },
            'Random': { name: 'Random', messages: [] }
        };

        // Auth
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            currentUser = document.getElementById('username').value.trim();
            if (currentUser) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('chatContainer').classList.add('active');
                document.getElementById('currentUsername').textContent = `@${currentUser}`;
                initChat();
            }
        });

        function initChat() {
            renderChatList();
            selectChat('General');
        }

        function renderChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            Object.keys(chats).forEach(chatName => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item';
                if (chatName === activeChat) chatItem.classList.add('active');
                chatItem.innerHTML = `
                    <div class="chat-item-avatar">#</div>
                    <div class="chat-item-name">${chatName}</div>
                `;
                chatItem.addEventListener('click', () => selectChat(chatName));
                chatList.appendChild(chatItem);
            });
        }

        function selectChat(chatName) {
            activeChat = chatName;
            document.getElementById('activeChatName').textContent = `# ${chatName}`;
            renderMessages();
            renderChatList();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const messages = chats[activeChat].messages;
            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message${msg.sender === currentUser ? ' own' : ''}`;

                messageDiv.innerHTML = `
                    ${msg.sender !== currentUser ? `<div class="message-avatar">${msg.sender.charAt(0).toUpperCase()}</div>` : ''}
                    <div class="message-content">
                        ${msg.sender !== currentUser ? `<div class="message-sender">${msg.sender}</div>` : ''}
                        <div class="message-bubble">
                            <p>${msg.text}</p>
                            <span class="message-time">${msg.time}</span>
                        </div>
                    </div>
                    ${msg.sender === currentUser ? `<div class="message-avatar">${msg.sender.charAt(0).toUpperCase()}</div>` : ''}
                `;

                container.appendChild(messageDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        // Send message
        document.getElementById('messageForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (text && activeChat) {
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

                chats[activeChat].messages.push({
                    sender: currentUser,
                    text: text,
                    time: time
                });

                input.value = '';
                renderMessages();
            }
        });
    </script>
</body>
</html>
